
<!DOCTYPE html>
<html>
<head>
  <title>NEXUS AI - Candle Core Test</title>
</head>
<body>
  <h1>NEXUS AI V2.0</h1>
  <h2>Candle Core Test</h2>

  <pre id="result">Testing...</pre>

  <script type="module">
    import { validateCandle, analyzeCandle }
      from './engine.js';

    const candle = {
      open: 100,
      high: 110,
      low: 95,
      close: 108,
      volume: 500
    };

    const result = {
      valid: validateCandle(candle),
      analysis: analyzeCandle(candle)
    };

    document.getElementById('result').textContent =
      JSON.stringify(result, null, 2);
  </script>
</body>
</html>
