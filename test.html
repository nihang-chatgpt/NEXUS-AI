
<!DOCTYPE html>
<html>
<head>
  <title>NEXUS AI V2.0 Test</title>
</head>
<body>
  <h1>NEXUS AI V2.0</h1>
  <h2>Candle Core Diagnostic</h2>
  <pre id="result">Starting test...</pre>

  <script type="module">
    const output = document.getElementById("result");

    try {
      const engine = await import("./engine.js");

      const candle = {
        open: 100,
        high: 110,
        low: 95,
        close: 108,
        volume: 500
      };

      output.textContent = JSON.stringify({
        valid: engine.validateCandle(candle),
        analysis: engine.analyzeCandle(candle)
      }, null, 2);

    } catch (error) {
      output.textContent = "ERROR: " + error.message;
    }
  </script>
</body>
</html>
